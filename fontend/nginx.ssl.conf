# 服务器前端容器挂载版（带 HTTPS/SSL）
# 用法：docker run -v /path/nginx.ssl.conf:/etc/nginx/conf.d/default.conf:ro ...
# 证书路径需与 docker run -v 挂载的证书目录一致

server {
    listen 80;
    server_name blog.fireflyai.site;
    # HTTP 强制跳转 HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name blog.fireflyai.site;

    ssl_certificate     /etc/nginx/ssl/blog.fireflyai.site.pem;
    ssl_certificate_key /etc/nginx/ssl/blog.fireflyai.site.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    root /usr/share/nginx/html;
    index index.html;

    # ====== Vue Router history 模式 ======
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== API 反向代理（与后端容器同网络时 backend 可解析） ======
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ====== 静态资源缓存 ======
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|mp3|wav|ogg|m4a)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
}
