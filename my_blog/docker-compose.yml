# docker-compose.yml
# 放在仓库根目录 D:\Agent\my_blog\ （与 fontend/、ssl/ 同级）
# 启动：docker compose up -d --build   （改完代码后加 --build 重建镜像）

services:
  # ============================================
  # 1. MySQL 和 Redis 数据库
  # ============================================
  mysql:
    image: crpi-9640jlmu7u6aesbj.cn-guangzhou.personal.cr.aliyuncs.com/ali_cat/agent:mysql8.0
    container_name: blog-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PWD}
      MYSQL_DATABASE: ${DB_NAME}
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"        # 宿主机 3307 → 容器 3306，避免和本地 MySQL 冲突
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PWD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - blog-network

  redis:
    image: redis:7-alpine
    container_name: blog-redis
    restart: always
    # 不暴露宿主机端口：backend 走 blog-network 内网访问 redis:6379
    # 如需宿主机连接，临时 exec 进容器或用 docker exec -it blog-redis redis-cli
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - blog-network

  # ============================================
  # 2. FastAPI 后端
  # ============================================
  backend:
    build:
      context: ./blog_backend
      dockerfile: Dockerfile
    image: crpi-9640jlmu7u6aesbj.cn-guangzhou.personal.cr.aliyuncs.com/ali_cat/agent:blog_backend_latest
    container_name: blog-backend
    restart: always
    environment:
      DB_HOST: mysql          # 指向 MySQL 容器名，不是 127.0.0.1
      DB_PORT: 3306           # 容器内部端口，不是宿主机的 3307
      DB_USER: root
      DB_PWD: ${DB_PWD}
      DB_NAME: ${DB_NAME}
      JWT_PWD: ${JWT_PWD}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      QWEN_MODEL: ${QWEN_MODEL}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_DB: 0
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    # 健康检查：容器内自带 python，用 urllib 探活（不依赖 curl）
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 60s
    volumes:
      - chroma_data:/app/chroma_data
      - uploads_data:/app/uploads   # 图片上传持久化（落盘在 /app/uploads，与 main.py StaticFiles 挂载一致）
    networks:
      - blog-network

  # ============================================
  # 3. nginx 前端
  # ============================================
  frontend:
    build:
      context: ./fontend
      dockerfile: Dockerfile
    image: crpi-9640jlmu7u6aesbj.cn-guangzhou.personal.cr.aliyuncs.com/ali_cat/agent:blog_fontend-latest
    container_name: blog-frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./ssl:/etc/nginx/ssl
      - ./fontend/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - blog-network

# ============================================
# 数据卷 & 网络
# ============================================
volumes:
  mysql_data:                # MySQL 数据持久化
  chroma_data:               # Chroma 向量库持久化（需 app 的 persist_directory=/app/chroma_data）
  uploads_data:              # 图片上传持久化（backend 容器内 /app/uploads）
networks:
  blog-network:              # 自定义桥接网
    driver: bridge
