# ====== 限流区域：短信发送接口按客户端 IP 限速，防短信轰炸 ======
# 放在 http 上下文（本文件被主配置 include 进 http），10MB 共享内存，速率 1 请求/秒
limit_req_zone $binary_remote_addr zone=sms_zone:10m rate=1r/s;

# ====== HTTP: 80 端口，全部 301 跳转到 HTTPS ======
server {
    listen 80;
    server_name blog.fireflyai.site;

    # 所有 http 请求永久跳转到 https
    return 301 https://$host$request_uri;
}

# ====== HTTPS: 443 端口，主服务 ======
server {
    listen 443 ssl;
    http2 on;
    server_name blog.fireflyai.site;

    # ====== SSL 证书 ======
    # 证书文件路径对应 docker-compose.yml 里挂载的 ./ssl:/etc/nginx/ssl
    ssl_certificate     /etc/nginx/ssl/blog.fireflyai.site.pem;
    ssl_certificate_key /etc/nginx/ssl/blog.fireflyai.site.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: 强制浏览器后续都走 https（1年）
    add_header Strict-Transport-Security "max-age=31536000" always;

    # 其余安全响应头（零风险加固）
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # CSP 基础版（按需放宽）：先注释观察，确认站点无 inline 脚本/样式报错再启用
    # add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self' 'unsafe-inline'; script-src 'self'" always;

    # 前端静态文件根目录
    root /usr/share/nginx/html;
    index index.html;

    # ====== Vue Router history 模式支持 ======
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ====== 短信发送接口限流（边缘防护，配合后端 60s 冷却）======
    # = 精确匹配优先于下方 /api/ 前缀匹配
    location = /api/sms/send {
        limit_req zone=sms_zone burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ====== API 反向代理 ======
    # 前端请求 /api/* 时，nginx 原样转发到后端容器（不剥前缀）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 流式响应支持（AI 对话用）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # ====== Sitemap（SEO 优化）======
    # 后端接口实际路径为 /api/blogs/sitemap.xml，反代到站点根 /sitemap.xml，
    # 方便搜索引擎直接抓取 https://blog.fireflyai.site/sitemap.xml
    location = /sitemap.xml {
        proxy_pass http://backend:8000/api/blogs/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ====== robots.txt（声明 sitemap 位置，便于收录）======
    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nAllow: /\n\nSitemap: https://blog.fireflyai.site/sitemap.xml\n";
    }

    # ====== 图片上传目录反代（须 ^~，否则被下方静态资源正则 \.png$ 抢走导致 404）======
    location ^~ /api/blogs/uploads/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 30d;
        add_header Cache-Control "public";
    }

    # ====== 静态资源缓存 ======
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?|ttf|eot|mp3|wav|ogg|m4a)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # gzip 压缩
    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 1000;
}